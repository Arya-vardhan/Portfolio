<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="waxGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="25%" stop-color="#dc2626"/>
      <stop offset="55%" stop-color="#991b1b"/>
      <stop offset="85%" stop-color="#701010"/>
      <stop offset="100%" stop-color="#3b0505"/>
    </radialGradient>
    
    <radialGradient id="goldGrad" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="65%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#58310c"/>
    </radialGradient>

    <radialGradient id="pinGrad" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#ca8a04"/>
      <stop offset="90%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#422006"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="pinShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1a0404" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Drop Shadow Base -->
  <circle cx="256" cy="272" r="224" fill="#0c0907" filter="url(#shadow)"/>

  <!-- Outer Beveled Gold Rim -->
  <circle cx="256" cy="270" r="222" fill="url(#goldGrad)"/>
  <circle cx="256" cy="270" r="208" fill="#2b0a0a"/>

  <!-- Crimson Wax Seal Medallion -->
  <circle cx="256" cy="270" r="202" fill="url(#waxGrad)"/>

  <!-- Inner Concentric Gold Forensic Border -->
  <circle cx="256" cy="270" r="176" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.95"/>
  <circle cx="256" cy="270" r="166" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="6,7" opacity="0.75"/>

  <!-- Top Forensic Star Cluster -->
  <g fill="#fef08a" opacity="0.95" filter="url(#textShadow)">
    <path d="M 256,132 L 261,146 L 276,146 L 264,155 L 268,169 L 256,160 L 244,169 L 248,155 L 236,146 L 251,146 Z"/>
    <circle cx="216" cy="152" r="4.5"/>
    <circle cx="296" cy="152" r="4.5"/>
  </g>

  <!-- High-Contrast Bold Serif "AV" Monogram -->
  <g filter="url(#textShadow)">
    <text x="256" y="328" 
          font-family="'Georgia', 'Times New Roman', serif" 
          font-weight="900" 
          font-size="172" 
          letter-spacing="-8" 
          text-anchor="middle" 
          fill="#fffdf7">AV</text>
  </g>

  <!-- Bottom Arch: Forensic Ribbon & Three Stars -->
  <g filter="url(#textShadow)">
    <line x1="168" y1="368" x2="220" y2="368" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="292" y1="368" x2="344" y2="368" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 256,360 L 259,368 L 268,368 L 261,373 L 263,381 L 256,376 L 249,381 L 251,373 L 244,368 L 253,368 Z" fill="#fef08a"/>
    <circle cx="236" cy="368" r="3" fill="#fef08a"/>
    <circle cx="276" cy="368" r="3" fill="#fef08a"/>
  </g>

  <!-- Brass Pushpin Pinned at Top Rim -->
  <g filter="url(#pinShadow)">
    <ellipse cx="256" cy="56" rx="36" ry="24" fill="url(#goldGrad)"/>
    <circle cx="256" cy="48" r="30" fill="url(#pinGrad)"/>
    <ellipse cx="247" cy="40" rx="10" ry="7" fill="#ffffff" opacity="0.85" transform="rotate(-18, 247, 40)"/>
  </g>
</svg>